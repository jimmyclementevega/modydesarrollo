    function loadState() {

        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          lots: Array.isArray(parsed.lots) && parsed.lots.length ? parsed.lots : JSON.parse(JSON.stringify(DEFAULT_STATE.lots))
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Fallback silencioso si el almacenamiento está restringido
      }
    }

    // =========================================================================
    // UTILIDADES VISUALES (SVG QR DETERMINISTA, ICONOS, TOASTS Y MODALES)
    // =========================================================================
    function generateDeterministicQR(text, size = 84) {
      const grid = 11;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      const cell = size / grid;
      let rects = '';

      // Patrones de posición (esquinas QR)
      const isFinder = (r, c) => {
        if (r < 3 && c < 3) return true;
        if (r < 3 && c >= grid - 3) return true;
        if (r >= grid - 3 && c < 3) return true;
        return false;
      };

      const isFinderHole = (r, c) => {
        return (r === 1 && c === 1) || (r === 1 && c === grid - 2) || (r === grid - 2 && c === 1);
      };

      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          let filled = false;
          if (isFinder(r, c)) {
            filled = !isFinderHole(r, c);
          } else {
            const bit = ((hash >>> ((r * grid + c) % 24)) ^ (r * 7 + c * 13)) & 1;
            filled = bit === 1;
          }
          if (filled) {
            rects += `<rect x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${(cell + 0.15).toFixed(2)}" height="${(cell + 0.15).toFixed(2)}" fill="#111827" rx="0.6" />`;
          }
        }
      }

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="block mx-auto" role="img" aria-label="Código QR ${text}">
          <rect width="${size}" height="${size}" fill="#ffffff" rx="4" />
          ${rects}
        </svg>
      `;
    }

    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const colors = {
        success: 'bg-white border-emerald-300 text-slate-900',
        warning: 'bg-amber-50 border-amber-300 text-amber-950',
        danger: 'bg-rose-50 border-rose-300 text-rose-950',
        info: 'bg-forest-900 border-emerald-600 text-white'
      };
      const dotColors = {
        success: 'bg-emerald-500',
        warning: 'bg-amber-500',
        danger: 'bg-rose-500',
        info: 'bg-limeagro-400'
      };

      const toast = document.createElement('div');
      toast.id = id;
      toast.className = `pointer-events-auto rounded-2xl border px-4 py-3 shadow-xl flex items-start gap-3 transition-all duration-300 ${colors[type] || colors.success}`;
      toast.innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0 ${dotColors[type] || dotColors.success}"></span>
        <div class="flex-1 text-xs">
          <p class="font-bold text-sm leading-tight">${title}</p>
          <p class="opacity-85 mt-0.5 leading-snug">${message}</p>
        </div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        setTimeout(() => toast.remove(), 260);
      }, 3400);
    }

    function openModal(tag, title, bodyHtml) {
      document.getElementById('modal-tag').textContent = tag;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function hideModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function closeModal(e) {
      if (e.target.id === 'modal-backdrop') hideModal();
    }

    // =========================================================================
    // SIMULACIÓN DE CONECTIVIDAD EN PLANTA (ONLINE / OFFLINE + CACHÉ LOCAL)
    // =========================================================================
    function toggleConnectivity() {
      state.isOnline = !state.isOnline;
      if (state.isOnline) {
        const syncedNow = state.pendingSyncCount;
        state.lots.forEach(l => l.synced = true);
        state.pendingSyncCount = 0;
        const now = new Date();
        state.lastSyncTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        showToast(
          'Conexión restablecida en planta',
          syncedNow > 0
            ? `Se sincronizaron ${syncedNow} registro(s) desde la caché local sin duplicados (RNF-02).`
            : 'Todos los módulos sincronizados con el servidor central SIGA.',
          'success'
        );
      } else {
        showToast(
          'Modo Offline activado (Planta)',
          'Conectividad interrumpida. Los nuevos registros se guardarán en caché local (SQLite/LocalStorage).',
          'warning'
        );
      }
      saveState();
      renderCurrentView();
    }

      }
    }

    function fillDemoRole(name, initials, role, email) {
      document.getElementById('login-user').value = email;
      document.getElementById('login-pass').value = 'AgroVerde2026';
      state.currentUser = {
        name,
        initials,
        role,
        inspectorInitials: initials
      };
      saveState();
      showToast('Perfil seleccionado', `Credenciales cargadas para ${name} (${role}).`, 'info');
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const userVal = document.getElementById('login-user').value.trim();
      if (!userVal) return;
      showToast('Sesión iniciada', `Bienvenido(a), ${state.currentUser.name} · Rol: ${state.currentUser.role}.`, 'success');
      navigateTo('dashboard');
    }

          </div>
        `
      );
    }

    function handleRegisterLotSubmit(e) {
      e.preventDefault();
      const code = document.getElementById('reg-code').value.trim();
      const productFull = document.getElementById('reg-product').value;
      const origin = document.getElementById('reg-origin').value;
      const kg = parseInt(document.getElementById('reg-kg').value, 10) || 600;
      const receptionDateInput = document.getElementById('reg-date').value.trim() || '29/09/2026';
      const shortProduct = productFull.includes('Espárrago')
        ? 'Espárrago'
        : productFull.includes('Palta')
        ? 'Palta'
        : 'Arándano';

      const lineMap = {
        'Espárrago': 'Línea 1',
        'Palta': 'Línea 2',
        'Arándano': 'Línea 3'
      };

      const now = new Date();
      const timeFormatted = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} AM`;

      const newLot = {
        code,
        regCode: `REG · 2026-${String(state.nextCorrelative).padStart(3, '0')}-PE`,
        product: shortProduct,
        productFull,
        kg,
        destination: 'EE. UU.',
        origin,
        originLocation: `${origin} · La Libertad`,
        line: lineMap[shortProduct] || 'Línea 1',
        receptionDate: '29 sep 2026',
        receptionDateInput,
        receptionTime: timeFormatted,
        productionTime: 'En curso',
        coldChain: '3.4 °C · Estable',
        chamber: 'Cámara de Frío B-12',
        qualityStatus: 'PENDIENTE',
        qualityScore: 'Pendiente',
        qualityLabel: 'Pendiente de inspección',
        reprocess: false,
        observations: 'Lote recién recepcionado en planta.',
        stagesCompleted: 2,
        dispatchStatus: 'Pendiente de control de calidad',
        dispatchBadge: 'PENDIENTE',
        synced: state.isOnline
      };

      state.lots.unshift(newLot);
      state.nextCorrelative += 1;
      state.selectedTraceCode = newLot.code;
      state.selectedQualityCode = newLot.code;

      if (!state.isOnline) {
        state.pendingSyncCount += 1;
      }

      saveState();

      showToast(
        state.isOnline ? `Lote ${code} registrado` : `Lote ${code} guardado en caché offline`,
        `${productFull} (${kg} kg) · ${origin}. Disponible en Trazabilidad y Control de Calidad.`,
        state.isOnline ? 'success' : 'warning'
      );

      navigateTo('traceability', { lotCode: newLot.code });
    }

              <div class="flex flex-wrap items-start justify-between gap-3">
                <div>
                  <p class="text-[11px] font-bold uppercase tracking-wider text-emerald-700 flex items-center gap-1.5">
                    <span class="w-3.5 h-3.5 rounded bg-emerald-100 text-emerald-700 inline-flex items-center justify-center text-[9px]">✓</span>
                    OPERACIONES · CONTROL DE CALIDAD
                  </p>
                  <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 tracking-tight mt-1">
                    Evaluación de Control de Calidad
                  </h1>
                </div>

                <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[11px] font-extrabold uppercase tracking-wide bg-amber-100 text-amber-800">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  INSPECCIÓN EN CURSO
                </span>
              </div>

              <hr class="border-slate-100" />

              <!-- LOTE A EVALUAR -->
              <div>
                <label for="quality-lot-select" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">
                  LOTE A EVALUAR
                </label>
                <div class="relative flex items-center bg-[#f4f6f5] hover:bg-[#edf1ef] rounded-2xl px-4 py-3.5 border border-slate-200/80 transition">
                  <span class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center mr-3.5 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                  </span>
                  <div class="flex-1 min-w-0">
                    <select id="quality-lot-select" onchange="handleQualityLotChange(this.value)"
                      class="w-full bg-transparent font-display font-bold text-sm sm:text-base text-slate-900 focus:outline-none cursor-pointer">
                      ${state.lots.map(l => `
                        <option value="${l.code}" ${l.code === activeLot.code ? 'selected' : ''}>
                          Lote ${l.code} - ${l.product} (${l.kg} kg)
                        </option>
                      `).join('')}
                    </select>
                    <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400 mt-0.5 truncate">
                      RECEPCIÓN ${activeLot.receptionDate.toUpperCase()} · ORIGEN ${activeLot.origin.toUpperCase()}
                    </p>
                  </div>
                </div>
              </div>

              <!-- RESULTADO DE LA EVALUACIÓN -->
              <div>
                <div class="flex items-center justify-between mb-2.5">
                  <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    RESULTADO DE LA EVALUACIÓN
                  </span>
                  <span class="text-[11px] text-slate-400 font-medium">Seleccione una opción</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                  <!-- Opción 1: APROBADO -->
                  <button type="button" onclick="selectQualityVerdict('APROBADO')"
                    class="text-left rounded-2xl p-4 border-2 transition cursor-pointer ${
                      verdict === 'APROBADO'
                        ? 'bg-[#e7f8ed] border-[#2cd45b] shadow-sm'
                        : 'bg-[#f2fbf5] border-emerald-200/70 hover:border-emerald-300'
                    }">
                    <div class="flex items-center justify-between mb-3">
                      <span class="w-7 h-7 rounded-lg bg-white text-emerald-600 flex items-center justify-center font-bold shadow-2xs">
                        ✓
                      </span>
                      <span class="w-4 h-4 rounded-full border-2 flex items-center justify-center ${
                        verdict === 'APROBADO' ? 'border-emerald-600' : 'border-slate-300 bg-white'
                      }">
                        ${verdict === 'APROBADO' ? '<span class="w-2 h-2 rounded-full bg-emerald-600"></span>' : ''}
                      </span>
                    </div>
                    <p class="font-display font-extrabold text-sm text-emerald-700">APROBADO</p>
                    <p class="text-[11px] text-slate-600 mt-1 leading-snug">
                      Cumple con los parámetros de calidad.
                    </p>
                  </button>

                  <!-- Opción 2: OBSERVADO -->
                  <button type="button" onclick="selectQualityVerdict('OBSERVADO')"
                    class="text-left rounded-2xl p-4 border-2 transition cursor-pointer ${
                      verdict === 'OBSERVADO'
                        ? 'bg-[#fef6dc] border-[#d99b26] shadow-sm'
                        : 'bg-[#fef9e7] border-amber-200/70 hover:border-amber-300'
                    }">
                    <div class="flex items-center justify-between mb-3">
                      <span class="w-7 h-7 rounded-lg bg-white text-amber-600 flex items-center justify-center font-bold shadow-2xs">
                        ⚠
                      </span>
                      <span class="w-4 h-4 rounded-full border-2 flex items-center justify-center ${
                        verdict === 'OBSERVADO' ? 'border-[#9a6700]' : 'border-slate-300 bg-white'
                      }">
                        ${verdict === 'OBSERVADO' ? '<span class="w-2 h-2 rounded-full bg-[#9a6700]"></span>' : ''}
                      </span>
                    </div>
                    <p class="font-display font-extrabold text-sm text-[#a16207]">OBSERVADO</p>
                    <p class="text-[11px] text-slate-600 mt-1 leading-snug">
                      Requiere revisión o reproceso antes de continuar.
                    </p>
                  </button>

                  <!-- Opción 3: RECHAZADO -->
                  <button type="button" onclick="selectQualityVerdict('RECHAZADO')"
                    class="text-left rounded-2xl p-4 border-2 transition cursor-pointer ${
                      verdict === 'RECHAZADO'
                        ? 'bg-[#fde8ea] border-rose-500 shadow-sm'
                        : 'bg-[#fef2f3] border-rose-200/70 hover:border-rose-300'
                    }">
                    <div class="flex items-center justify-between mb-3">
                      <span class="w-7 h-7 rounded-lg bg-white text-rose-600 flex items-center justify-center font-bold shadow-2xs">
                        ✕
                      </span>
                      <span class="w-4 h-4 rounded-full border-2 flex items-center justify-center ${
                        verdict === 'RECHAZADO' ? 'border-rose-600' : 'border-slate-300 bg-white'
                      }">
                        ${verdict === 'RECHAZADO' ? '<span class="w-2 h-2 rounded-full bg-rose-600"></span>' : ''}
                      </span>
                    </div>
                    <p class="font-display font-extrabold text-sm text-rose-700">RECHAZADO</p>
                    <p class="text-[11px] text-slate-600 mt-1 leading-snug">
                      No cumple con los criterios de aceptación.
                    </p>
                  </button>
                </div>
              </div>

              <!-- OBSERVACIONES DEL INSPECTOR -->
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label for="quality-obs" class="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    OBSERVACIONES DEL INSPECTOR
                  </label>
                  <span id="quality-char-count" class="text-[11px] text-slate-400 font-medium">
                    ${obsText.length} / 500
                  </span>
                </div>
                <textarea id="quality-obs" rows="3" maxlength="500"
                  oninput="updateQualityObservations(this.value)"
                  placeholder="Ingrese los hallazgos de la inspección física y madurez del producto..."
                  class="w-full rounded-2xl border border-slate-200 bg-[#fbfcfb] p-3.5 text-sm text-slate-800 placeholder:text-slate-400 focus:border-[#2cd45b] focus:bg-white focus:outline-none transition">${obsText}</textarea>
                <p class="text-[11px] text-slate-400 mt-1.5 flex items-center gap-1.5">
                  <span class="w-3.5 h-3.5 rounded-full border border-slate-300 inline-flex items-center justify-center text-[9px]">i</span>
                  <span>Incluya calibre, color, firmeza y cualquier desviación relevante.</span>
                </p>
              </div>

              <!-- Fila Toggle: Enviar a Reproceso -->
              <div class="rounded-2xl bg-[#f3f8f4] border border-emerald-200/70 px-4 py-3.5 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <span class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                  </span>
                  <div>
                    <p class="font-display font-bold text-sm text-slate-900">Enviar a Reproceso</p>
                    <p class="text-xs text-slate-500">El lote quedará bloqueado hasta completar una nueva evaluación.</p>
                  </div>
                </div>

                <!-- Switch Toggle Verde -->
                <button type="button" role="switch" aria-checked="${sendToReprocess}" onclick="toggleQualityReprocess()"
                  class="w-12 h-7 rounded-full p-1 transition-colors cursor-pointer shrink-0 ${
                    sendToReprocess ? 'bg-[#2cd45b]' : 'bg-slate-300'
                  }">
                  <span class="block w-5 h-5 rounded-full bg-white shadow-sm transform transition-transform ${
                    sendToReprocess ? 'translate-x-5' : 'translate-x-0'
                  }"></span>
                </button>
              </div>

              <!-- Botón Ancho GUARDAR INSPECCIÓN -->
              <div>
                <button type="button" onclick="handleSaveQualityInspection()"
                  class="w-full py-3.5 px-6 rounded-full bg-[#2cd45b] hover:bg-[#24ba4e] text-forest-950 font-extrabold text-sm tracking-wide shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 transition cursor-pointer">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                  </svg>
                  <span>GUARDAR INSPECCIÓN</span>
                </button>

                <p class="text-center text-[11px] text-slate-400 mt-3 flex items-center justify-center gap-1.5">
                  <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                  </svg>
                  <span>El registro quedará asociado al lote ${activeLot.code} y al Inspector activo.</span>
                </p>
              </div>
            </div>
          </section>

          <div class="h-4"></div>
        </div>
      `;
    }

    function handleQualityLotChange(lotCode) {
      state.selectedQualityCode = lotCode;
      saveState();
      renderCurrentView();
    }

    function selectQualityVerdict(verdict) {
      state.qualityFormDraft.verdict = verdict;
      if (verdict === 'OBSERVADO') {
        state.qualityFormDraft.sendToReprocess = true;
      } else if (verdict === 'APROBADO') {
        state.qualityFormDraft.sendToReprocess = false;
      }
      saveState();
      renderCurrentView();
    }

    function updateQualityObservations(val) {
      state.qualityFormDraft.observations = val;
      const counter = document.getElementById('quality-char-count');
      if (counter) counter.textContent = `${val.length} / 500`;
    }

    function toggleQualityReprocess() {
      state.qualityFormDraft.sendToReprocess = !state.qualityFormDraft.sendToReprocess;
      saveState();
      renderCurrentView();
    }

    function handleSaveQualityInspection() {
      const lot = state.lots.find(l => l.code === state.selectedQualityCode) || state.lots[0];
      const verdict = state.qualityFormDraft.verdict;
      const obs = state.qualityFormDraft.observations.trim();
      const reprocess = state.qualityFormDraft.sendToReprocess;

      lot.qualityStatus = verdict;
      lot.reprocess = reprocess;
      lot.observations = obs || lot.observations;

      if (verdict === 'APROBADO') {
        lot.qualityScore = '100%';
        lot.qualityLabel = 'Calidad Aprobada (100%)';
        lot.stagesCompleted = 4;
        lot.dispatchStatus = 'Pendiente de carga a contenedor';
        lot.dispatchBadge = 'PENDIENTE';
      } else if (verdict === 'OBSERVADO') {
        lot.qualityScore = 'Observado';
        lot.qualityLabel = reprocess ? 'Observado · Enviado a Reproceso' : 'Observado · En Revisión';
        lot.stagesCompleted = 3;
        lot.dispatchStatus = 'Bloqueado hasta nueva evaluación';
        lot.dispatchBadge = 'BLOQUEADO';
      } else {
        lot.qualityScore = 'Rechazado';
        lot.qualityLabel = 'Rechazado · No conforme';
        lot.stagesCompleted = 3;
        lot.dispatchStatus = 'Bloqueado automáticamente para exportación';
        lot.dispatchBadge = 'BLOQUEADO';
      }

      if (!state.isOnline) {
        lot.synced = false;
        state.pendingSyncCount += 1;
      }

      state.selectedTraceCode = lot.code;
      saveState();

      showToast(
        `Dictamen ${verdict} guardado`,
        `El lote ${lot.code} fue actualizado (${lot.qualityLabel}).`,
        verdict === 'APROBADO' ? 'success' : verdict === 'OBSERVADO' ? 'warning' : 'danger'
      );

      navigateTo('traceability', { lotCode: lot.code });
    }

    // =========================================================================
    // VISTA 6: TRAZABILIDAD DE LOTE
    // =========================================================================
    function renderTraceabilityView() {
      const lot = state.lots.find(l => l.code.toLowerCase() === state.selectedTraceCode.toLowerCase()) || state.lots[0];
      const isApproved = lot.qualityStatus === 'APROBADO';
      const isObserved = lot.qualityStatus === 'OBSERVADO';
      const isRejected = lot.qualityStatus === 'RECHAZADO';

      const qualityStageStyle = isApproved
        ? { circle: 'bg-[#1a8a44] text-white', icon: '✓', badgeBg: 'bg-emerald-100 text-emerald-800', badgeText: lot.qualityScore }
        : isObserved
        ? { circle: 'bg-amber-500 text-white', icon: '!', badgeBg: 'bg-amber-100 text-amber-800', badgeText: 'OBSERVADO' }
        : isRejected
        ? { circle: 'bg-rose-600 text-white', icon: '✕', badgeBg: 'bg-rose-100 text-rose-800', badgeText: 'RECHAZADO' }
        : { circle: 'bg-slate-200 text-slate-500', icon: '•', badgeBg: 'bg-slate-100 text-slate-600', badgeText: 'PENDIENTE' };

      const warehouseDone = isApproved;

      return `
        <div class="view-section min-h-screen bg-agro-forest text-white flex flex-col justify-between relative overflow-hidden">
          <!-- Círculo decorativo amarillo dorado a la derecha -->
          <div class="w-72 h-72 sm:w-80 sm:h-80 rounded-full bg-[#f3cf55] absolute top-44 -right-24 sm:-right-14 pointer-events-none"></div>

          <!-- Barra Superior -->
          <header class="w-full max-w-6xl mx-auto px-5 sm:px-8 pt-6 pb-4 flex items-center justify-between relative z-10">
            <div onclick="navigateTo('dashboard')" class="flex items-center gap-2.5 cursor-pointer">
              <span class="w-8 h-8 rounded-xl bg-[#2cd45b] text-forest-950 flex items-center justify-center shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 20V10m0 0c0-3.5 3-6 6-6 0 3.5-2.5 6-6 6zm0 3c0-3-2.5-5-5-5 0 3 2 5 5 5z" />
                </svg>
              </span>
              <div class="leading-none">
                <p class="font-display font-extrabold text-sm text-white">SIGA</p>
                <p class="text-[9px] font-bold tracking-widest text-limeagro-400 uppercase">AGROVERDE</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              ${renderSystemStatusPill('dark')}
              <span class="w-8 h-8 rounded-full bg-[#174730] border border-emerald-500/40 text-xs font-bold text-white flex items-center justify-center">
                AV
              </span>
            </div>
          </header>

          <!-- Contenido Principal -->
          <section class="w-full max-w-4xl mx-auto px-4 sm:px-6 py-4 space-y-5 relative z-10 my-auto">
            <!-- Encabezado -->
            <div>
              <p class="text-[11px] font-bold uppercase tracking-widest text-[#e6c243] flex items-center gap-1.5">
                <span>⬡</span> CONTROL DE CADENA PRODUCTIVA
              </p>
              <h1 class="font-display font-extrabold text-3xl sm:text-4xl text-white tracking-tight mt-1">
                Trazabilidad de lote
              </h1>
              <p class="text-xs sm:text-sm text-emerald-100/80 mt-1 max-w-xl">
                Consulta el recorrido completo del producto, desde su recepción hasta el despacho internacional.
              </p>
            </div>

            <!-- Barra de Búsqueda Blanca Redondeada -->
            <form onsubmit="handleTraceSearch(event)" class="bg-white rounded-2xl p-2 pl-4 shadow-xl flex flex-wrap sm:flex-nowrap items-center justify-between gap-2">
              <div class="flex items-center gap-3 flex-1 min-w-[200px]">
                <svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z" />
                </svg>
                <div class="flex-1">
                  <label for="trace-search-input" class="block text-[9px] font-bold uppercase tracking-wider text-slate-400">
                    CÓDIGO DE LOTE
                  </label>
                  <input id="trace-search-input" type="text" value="${lot.code}" list="lots-datalist"
                    placeholder="Ej. L-004 o LOTE-2026-089"
                    class="w-full text-sm sm:text-base font-display font-extrabold text-slate-900 focus:outline-none" />
                  <datalist id="lots-datalist">
                    ${state.lots.map(item => `<option value="${item.code}">${item.productFull} (${item.kg} kg)</option>`).join('')}
                  </datalist>
                </div>
              </div>

              <!-- Accesos rápidos a lotes existentes -->
              <div class="hidden md:flex items-center gap-1 pr-1">
                ${state.lots.slice(0, 3).map(item => `
                  <button type="button" onclick="selectTraceLot('${item.code}')"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition cursor-pointer ${
                      item.code === lot.code
                        ? 'bg-emerald-100 text-emerald-900'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }">
                    ${item.code}
                  </button>
                `).join('')}
              </div>

              <button type="submit"
                class="px-5 py-3 rounded-xl bg-[#167c3f] hover:bg-[#126634] text-white font-bold text-xs sm:text-sm inline-flex items-center gap-2 transition cursor-pointer shrink-0">
                <span>Buscar lote</span>
                <span>→</span>
              </button>
            </form>

            <!-- Tarjeta Blanca Principal FICHA DE LOTE -->
            <div class="bg-white text-slate-900 rounded-[1.75rem] p-6 sm:p-8 card-elevated relative">
              <!-- Cabecera de Ficha + Código QR -->
              <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <div class="flex flex-wrap items-center gap-2.5">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-[#103824] text-limeagro-400">
                      <span class="w-1.5 h-1.5 rounded-full bg-limeagro-400"></span>
                      FICHA DE LOTE
                    </span>
                    <span class="text-[11px] font-semibold text-slate-400 tracking-wide">
                      ${lot.regCode}
                    </span>
                  </div>

                  <div class="flex flex-wrap items-center gap-3 mt-2.5">
                    <h2 class="font-display font-extrabold text-3xl sm:text-4xl text-slate-900 tracking-tight">
                      Lote ${lot.code}
                    </h2>
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                      <span>🌿</span>
                      <span>${lot.product}</span>
                    </span>
                  </div>

                  <p class="text-xs sm:text-sm text-slate-500 font-medium mt-1">
                    ${lot.kg} kg · Destino ${lot.destination}
                  </p>
                </div>

                <!-- Código QR CR-01 -->
                <div class="p-2.5 rounded-2xl border border-slate-200 bg-white text-center shadow-2xs">
                  ${generateDeterministicQR(`SIGA-${lot.code}`, 82)}
                  <p class="text-[9px] font-bold tracking-widest text-slate-400 uppercase mt-1">
                    SIGA · ${lot.code}
                  </p>
                </div>
              </div>

              <!-- Línea de Tiempo del Proceso (5 etapas) -->
              <div class="mt-6 pt-5 border-t border-slate-100">
                <div class="flex items-center justify-between mb-5">
                  <span class="text-xs font-bold text-slate-700 inline-flex items-center gap-1.5">
                    <span class="text-emerald-600">⛓</span>
                    Línea de tiempo del proceso
                  </span>
                  <span class="text-[11px] font-bold text-emerald-700">
                    • ${lot.stagesCompleted} de 5 etapas completadas
                  </span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-5 gap-4 relative">
                  <!-- Etapa 1: Recepción -->
                  <div class="relative flex sm:flex-col items-start gap-3 sm:gap-1.5">
                    <div class="hidden sm:block absolute top-3.5 left-7 right-0 h-0.5 bg-[#1a8a44]"></div>
                    <span class="w-7 h-7 rounded-full bg-[#1a8a44] text-white text-xs font-bold flex items-center justify-center relative z-10 shrink-0">
                      ✓
                    </span>
                    <div>
                      <p class="font-display font-bold text-xs text-slate-900">Recepción</p>
                      <p class="text-[11px] text-slate-500">${lot.origin}</p>
                      <span class="inline-block mt-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700">
                        🕒 ${lot.receptionTime}
                      </span>
                    </div>
                  </div>

                  <!-- Etapa 2: Producción -->
                  <div class="relative flex sm:flex-col items-start gap-3 sm:gap-1.5">
                    <div class="hidden sm:block absolute top-3.5 left-7 right-0 h-0.5 bg-[#1a8a44]"></div>
                    <span class="w-7 h-7 rounded-full bg-[#1a8a44] text-white text-xs font-bold flex items-center justify-center relative z-10 shrink-0">
                      ✓
                    </span>
                    <div>
                      <p class="font-display font-bold text-xs text-slate-900">Producción</p>
                      <p class="text-[11px] text-slate-500">${lot.line}</p>
                      <span class="inline-block mt-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700">
                        🕒 ${lot.productionTime}
                      </span>
                    </div>
                  </div>

                  <!-- Etapa 3: Control de Calidad -->
                  <div class="relative flex sm:flex-col items-start gap-3 sm:gap-1.5">
                    <div class="hidden sm:block absolute top-3.5 left-7 right-0 h-0.5 ${warehouseDone ? 'bg-[#1a8a44]' : 'bg-slate-200'}"></div>
                    <span class="w-7 h-7 rounded-full ${qualityStageStyle.circle} text-xs font-bold flex items-center justify-center relative z-10 shrink-0">
                      ${qualityStageStyle.icon}
                    </span>
                    <div>
                      <p class="font-display font-bold text-xs text-slate-900">Control de Calidad</p>
                      <p class="text-[11px] text-slate-500">${lot.qualityLabel}</p>
                      <span class="inline-block mt-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold ${qualityStageStyle.badgeBg}">
                        ${qualityStageStyle.badgeText}
                      </span>
                    </div>
                  </div>

                  <!-- Etapa 4: Almacén -->
                  <div class="relative flex sm:flex-col items-start gap-3 sm:gap-1.5">
                    <div class="hidden sm:block absolute top-3.5 left-7 right-0 h-0.5 bg-slate-200"></div>
                    <span class="w-7 h-7 rounded-full ${
                      warehouseDone ? 'bg-[#1a8a44] text-white' : 'bg-slate-100 border-2 border-slate-300 text-slate-400'
                    } text-xs font-bold flex items-center justify-center relative z-10 shrink-0">
                      ${warehouseDone ? '✓' : '•'}
                    </span>
                    <div>
                      <p class="font-display font-bold text-xs ${warehouseDone ? 'text-slate-900' : 'text-slate-400'}">Almacén</p>
                      <p class="text-[11px] ${warehouseDone ? 'text-slate-500' : 'text-slate-400'}">
                        ${warehouseDone ? lot.chamber : 'En espera de aprobación'}
                      </p>
                    </div>
                  </div>

                  <!-- Etapa 5: Despacho -->
                  <div class="relative flex sm:flex-col items-start gap-3 sm:gap-1.5">
                    <span class="w-7 h-7 rounded-full bg-slate-100 border-2 border-slate-300 text-slate-400 text-xs font-bold flex items-center justify-center relative z-10 shrink-0">
                      •
                    </span>
                    <div>
                      <p class="font-display font-bold text-xs text-slate-400">Despacho</p>
                      <p class="text-[11px] text-slate-400 leading-snug">${lot.dispatchStatus}</p>
                      <span class="inline-block mt-1.5 px-2.5 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide ${
                        lot.dispatchBadge === 'BLOQUEADO'
                          ? 'bg-rose-100 text-rose-700'
                          : 'bg-slate-100 text-slate-500'
                      }">
                        ${lot.dispatchBadge}
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 3 Columnas Inferiores de Metadatos -->
              <div class="mt-6 pt-5 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-4 pr-16">
                <div class="flex items-center gap-3">
                  <span class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                  </span>
                  <div>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">ORIGEN</p>
                    <p class="font-display font-bold text-xs sm:text-sm text-slate-900">${lot.originLocation}</p>
                  </div>
                </div>

                <div class="flex items-center gap-3">
                  <span class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m0-18l-3 3m3-3l3 3m-3 15l-3-3m3 3l3-3M3 12h18" />
                    </svg>
                  </span>
                  <div>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">CADENA DE FRÍO</p>
                    <p class="font-display font-bold text-xs sm:text-sm text-slate-900">${lot.coldChain}</p>
                  </div>
                </div>

                <div class="flex items-center gap-3">
                  <span class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                  </span>
                  <div>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">FECHA DE PROCESO</p>
                    <p class="font-display font-bold text-xs sm:text-sm text-slate-900">${lot.receptionDate}</p>
                  </div>
                </div>
              </div>

              <!-- Sello circular azul-violeta flotante abajo a la derecha: TRAZABILIDAD 100% -->
              <div class="w-20 h-20 rounded-full bg-[#4847a8] text-white shadow-xl flex flex-col items-center justify-center text-center leading-tight absolute -bottom-4 -right-3 sm:-right-5 rotate-6 border-4 border-white/20">
                <span class="text-xs font-extrabold">✓</span>
                <span class="text-[8px] font-bold tracking-wider uppercase mt-0.5">TRAZABILIDAD</span>
                <span class="font-display font-black text-sm">100%</span>
              </div>
            </div>

            <!-- Pie de página oscuro -->
            <div class="pt-1 flex flex-wrap items-center justify-between gap-2 text-xs text-emerald-200/75">
              <div class="inline-flex items-center gap-2">
                <span class="w-4 h-4 rounded-full border border-emerald-400/50 flex items-center justify-center text-[10px] text-limeagro-400">✓</span>
                <span>Información sincronizada con SIGA · Última actualización hoy, ${state.lastSyncTime}</span>
              </div>

              <button onclick="navigateTo('quality', { lotCode: '${lot.code}' })"
                class="text-limeagro-400 hover:underline font-bold cursor-pointer">
                Evaluar este lote en Calidad →
              </button>
            </div>
          </section>

          <div class="h-4"></div>
        </div>
      `;
    }

    function selectTraceLot(code) {
      state.selectedTraceCode = code;
      saveState();
      renderCurrentView();
    }

    function handleTraceSearch(e) {
      e.preventDefault();
      const query = document.getElementById('trace-search-input').value.trim();
      if (!query) return;

      const found = state.lots.find(
        l => l.code.toLowerCase() === query.toLowerCase() || l.code.toLowerCase().includes(query.toLowerCase())
      );

      if (found) {
        state.selectedTraceCode = found.code;
        saveState();
        renderCurrentView();
        showToast(`Ficha encontrada: ${found.code}`, `${found.productFull} (${found.kg} kg) · ${found.qualityLabel}.`, 'success');
      } else {
        showToast(
          'Código de lote no encontrado',
          `No existe el código "${query}". Prueba con L-004, LOTE-2026-088 o registra uno nuevo.`,
          'warning'
        );
      }
    }

    // =========================================================================
    // RENDERIZADOR PRINCIPAL
    // =========================================================================
    function renderCurrentView() {
      const container = document.getElementById('view-container');
      switch (state.currentView) {
        case 'login':
          container.innerHTML = renderLoginView();
          break;
        case 'dashboard':
          container.innerHTML = renderDashboardView();
          break;
        case 'register':
          container.innerHTML = renderRegisterLotView();
          break;
        case 'quality':
          container.innerHTML = renderQualityView();
          break;
        case 'traceability':
          container.innerHTML = renderTraceabilityView();
          break;
        case 'landing':
        default:
          container.innerHTML = renderLandingView();
          break;
      }
      updateNavPills();
    }

    // Cerrar menú desplegable de usuario al hacer clic fuera
    document.addEventListener('click', (e) => {
      const dd = document.getElementById('user-dropdown');
      if (dd && !dd.classList.contains('hidden') && !e.target.closest('#user-dropdown') && !e.target.closest('button[onclick="toggleUserDropdown()"]')) {
        dd.classList.add('hidden');
      }
    });

    // Inicializar aplicación al cargar
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentView();
    });
  </script>
</body>
</html>
